<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>Bohrdaten Import</title>
  </head>
  <body>
    <div class="container-fluid">
      <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1"> GeoCorePortal </span>
        </div>
      </nav>
      <div class="card mb-4">
        <div class="card-body">
          <label for="excelFile">Excel-Datei auswählen</label>
          <input type="file" id="excelFile" accept=".xlsx" />
          <button id="importBtn" class="btn btn-primary">Importieren</button>
        </div>
      </div>
      <div class="card mb-3">
        <div class="card-header">📊 Dataset Statistics</div>

        <div class="card-body">
          <div id="statisticsPanel"></div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-3">
          <div class="card">
            <div class="card-header">Boreholes</div>

            <div class="card-body">
              <input
                type="text"
                id="searchInput"
                class="form-control mb-3"
                placeholder="🔍 Boreholes suchen..."
              />

              <div id="boreholeList"></div>

              <button id="showAllBtn" class="btn btn-secondary mt-3 w-100">
                Alle Boreholes zeigen
              </button>
            </div>
          </div>
        </div>

        <div class="col-md-9">
          <div class="card">
            <div class="card-header">Karte</div>

            <div class="card-body">
              <div id="map" class="rounded"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card mt-4">
        <div class="card-header">Borehole Information</div>

        <div class="card-body">
          <div id="metadataPanel"></div>
        </div>
      </div>
      <hr />
      <div class="card mt-4">
        <div class="card-header">Core Log</div>

        <div class="card-body">
          <table id="logTable" border="1">
            <thead></thead>
            <tbody></tbody>
          </table>
          <table border="1" id="resultTable"></table>
        </div>
      </div>
      <hr />

      <div class="card mt-4">
        <div class="card-header">Interval Details</div>

        <div class="card-body">
          <div id="detailPanel"></div>
        </div>
      </div>
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
      <script src="js/excel/excel-reader.js"></script>
      <script src="js/excel/interval-parser.js"></script>
      <script src="js/excel/metadata-parser.js"></script>
      <script src="js/ui/table-renderer.js"></script>
      <script src="js/ui/detail-panel.js"></script>
      <script src="js/ui/metadata-panel.js"></script>
      <script src="js/ui/borehole-list.js"></script>
      <script src="js/ui/statistics-panel.js"></script>
      <script src="js/models/borehole.js"></script>
      <script src="js/repositories/borehole-repository.js"></script>
      <script src="js/utils/date-utils.js"></script>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
      <script src="js/map/map-service.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
      <script src="js/state/application-state.js"></script>
      <script src="js/services/import-service.js"></script>
      <script src="js/services/coordinate-service.js"></script>
      <script src="js/services/selection-service.js"></script>
      <script src="js/services/search-service.js"></script>
      <script src="js/controllers/app-controller.js"></script>
      <script src="js/app.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </div>
  </body>
</html>
