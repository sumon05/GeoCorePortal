<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Bohrdaten Import</title>
  </head>
  <body>
    <h2>Bohrdaten Import</h2>
    <label for="excelFile">Excel-Datei auswählen</label>
    <input type="file" id="excelFile" accept=".xlsx" />
    <button id="importBtn">Importieren</button>
    <hr />
    <h3>Bohrkernlog</h3>

    <table id="logTable" border="1">
      <thead></thead>
      <tbody></tbody>
    </table>
    <table border="1" id="resultTable"></table>
    <hr />

    <h3>Intervall Details</h3>

    <div id="detailPanel">
      <p>Klicken Sie auf eine Zeile...</p>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/excel/excel-reader.js"></script>
    <script src="js/excel/interval-parser.js"></script>
    <script src="js/ui/table-renderer.js"></script>
    <script src="js/ui/detail-panel.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
