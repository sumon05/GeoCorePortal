info:
  name: excel_import
  type: http

http:
  method: POST
  url: http://localhost:3000/api/import/excel
  body:
    type: multipart-form
    data:
      - name: files
        type: file
        value:
          - e:\GeoCorePortal\backend\sample-data\MyCollection\demo-boreholes1.xlsx
          - e:\GeoCorePortal\backend\sample-data\MyCollection\demo-boreholes2.xlsx
        contentType: File
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
